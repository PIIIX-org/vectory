<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation, Error Handling & Publishing · Swimlane</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1400px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1180px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Design Tool System</p>
    <h1>Validation, Error Handling & Publishing</h1>

    <svg viewBox="0 0 1320 600" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ LANE DIVIDERS ============ -->
      <line x1="40" y1="80"  x2="1280" y2="80"  stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="220" x2="1280" y2="220" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="360" x2="1280" y2="360" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="40" y1="500" x2="1280" y2="500" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="160" y1="80" x2="160" y2="500" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

      <!-- ============ LANE LABELS ============ -->
      <text x="60" y="148" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.16em">VALIDATION</text>
      <text x="60" y="164" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.16em">PIPELINE</text>

      <text x="60" y="272" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.16em">ERROR</text>
      <text x="60" y="288" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.16em">HANDLING</text>
      <text x="60" y="304" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.08em">(on failure)</text>

      <text x="60" y="420" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.16em">PUBLISHING</text>
      <text x="60" y="436" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.16em">&amp; DEPLOY</text>

      <!-- ============ ARROWS (drawn before boxes) ============ -->

      <!-- Entry arrow into Lane 1 -->
      <line x1="164" y1="152" x2="178" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Lane 1 internal chip-chain connectors -->
      <line x1="340" y1="152" x2="358" y2="152" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="520" y1="152" x2="538" y2="152" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="700" y1="152" x2="718" y2="152" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="880" y1="152" x2="898" y2="152" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Fail branch: Lane 1 -> Lane 2 (dashed) -->
      <line x1="616" y1="176" x2="648" y2="248" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="600" y="204" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="628" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ON FAIL</text>

      <!-- Lane 2 internal connectors -->
      <line x1="580" y1="280" x2="596" y2="280" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#arrow)"/>
      <line x1="700" y1="280" x2="716" y2="280" stroke="#4f5d75" stroke-width="0.8" marker-end="url(#arrow)"/>

      <!-- Success branch: Lane 1 -> Lane 3 (accent, focal, bypasses Lane 2) -->
      <path d="M 1060 152 L 1240 152 L 1240 340 L 168 340 L 168 396 L 184 404"
            fill="none" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <rect x="1120" y="136" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1148" y="145" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PASSED</text>

      <!-- Lane 3 internal chip-chain connectors -->
      <line x1="320" y1="428" x2="334" y2="428" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="476" y1="428" x2="490" y2="428" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="632" y1="428" x2="646" y2="428" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="788" y1="428" x2="802" y2="428" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="944" y1="428" x2="958" y2="428" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="1100" y1="428" x2="1114" y2="428" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ============ LANE 1 — VALIDATION PIPELINE (5 chips) ============ -->
      <!-- 1. HTML Validation -->
      <rect x="180" y="128" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="180" y="128" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="260" y="148" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTML Validation</text>
      <text x="260" y="164" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">W3C · semantic tags</text>

      <!-- 2. CSS Linting -->
      <rect x="360" y="128" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="360" y="128" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="148" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CSS Linting</text>
      <text x="440" y="164" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">stylelint rules</text>

      <!-- 3. Accessibility -->
      <rect x="540" y="128" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="540" y="128" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="620" y="148" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Accessibility</text>
      <text x="620" y="164" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">WCAG 2.1 AA · ARIA</text>

      <!-- 4. Performance -->
      <rect x="720" y="128" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="720" y="128" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="148" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Performance</text>
      <text x="800" y="164" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">lighthouse · bundle</text>

      <!-- 5. Browser Compatibility -->
      <rect x="900" y="128" width="160" height="48" rx="6" fill="#ffffff"/>
      <rect x="900" y="128" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="980" y="148" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser Compat</text>
      <text x="980" y="164" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Chrome · FF · Safari</text>

      <!-- ============ LANE 2 — ERROR HANDLING (grouped, conditional) ============ -->
      <rect x="460" y="248" width="380" height="72" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- Detect -->
      <rect x="480" y="260" width="100" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="530" y="277" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detect</text>
      <text x="530" y="291" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">try-catch · health</text>

      <!-- Recover -->
      <rect x="600" y="260" width="100" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="650" y="277" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Recover</text>
      <text x="650" y="291" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">retry · rollback</text>

      <!-- Notify -->
      <rect x="720" y="260" width="100" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="770" y="277" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Notify</text>
      <text x="770" y="291" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">toast · Sentry</text>

      <!-- ============ LANE 3 — PUBLISHING & DEPLOYMENT (7 chips) ============ -->
      <!-- 1. Export -->
      <rect x="180" y="404" width="140" height="48" rx="6" fill="#ffffff"/>
      <rect x="180" y="404" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="250" y="424" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Export</text>
      <text x="250" y="440" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">ZIP · minified</text>

      <!-- 2. Choose Host -->
      <rect x="336" y="404" width="140" height="48" rx="6" fill="#ffffff"/>
      <rect x="336" y="404" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="406" y="424" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Choose Host</text>
      <text x="406" y="440" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">Vercel/Netlify</text>

      <!-- 3. Configure -->
      <rect x="492" y="404" width="140" height="48" rx="6" fill="#ffffff"/>
      <rect x="492" y="404" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="562" y="424" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Configure</text>
      <text x="562" y="440" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">domain · DNS · SSL</text>

      <!-- 4. Deploy -->
      <rect x="648" y="404" width="140" height="48" rx="6" fill="#ffffff"/>
      <rect x="648" y="404" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="718" y="424" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Deploy</text>
      <text x="718" y="440" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">build · cache purge</text>

      <!-- 5. Test Live -->
      <rect x="804" y="404" width="140" height="48" rx="6" fill="#ffffff"/>
      <rect x="804" y="404" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="874" y="424" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Test Live</text>
      <text x="874" y="440" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">visit · check links</text>

      <!-- 6. Monitor -->
      <rect x="960" y="404" width="140" height="48" rx="6" fill="#ffffff"/>
      <rect x="960" y="404" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1030" y="424" fill="#2d3142" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Monitor</text>
      <text x="1030" y="440" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">uptime · perf</text>

      <!-- 7. Live! (focal outcome) -->
      <rect x="1116" y="404" width="140" height="48" rx="6" fill="rgba(235,108,54,0.08)"/>
      <rect x="1116" y="404" width="140" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="1186" y="424" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Live!</text>
      <text x="1186" y="440" fill="#eb6c36" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">share URL</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="524" x2="1280" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="556" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Process step</text>

      <rect x="184" y="556" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="204" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal outcome</text>

      <rect x="344" y="556" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="364" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Conditional lane</text>

      <line x1="528" y1="561" x2="556" y2="561" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="564" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Within-lane flow</text>

      <line x1="716" y1="561" x2="744" y2="561" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="752" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">On-fail branch</text>

      <line x1="900" y1="561" x2="928" y2="561" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <text x="936" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Success handoff</text>
    </svg>
  </div>
</body>
</html>
