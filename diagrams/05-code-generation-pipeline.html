<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Generation Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Design Tool System</p>
    <h1>Code Generation Pipeline</h1>

    <svg viewBox="0 0 1040 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= ARROWS (drawn before boxes) ================= -->

      <!-- Row 1: 1→2→3→4 -->
      <line x1="200" y1="92" x2="240" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="92" x2="440" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="92" x2="640" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Wrap connector: 4 (Generate HTML) → 5 (Generate CSS) -->
      <path d="M720,120 C720,168 120,168 120,212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Row 2: 5→6→7→8 -->
      <line x1="200" y1="240" x2="240" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="400" y1="240" x2="440" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="240" x2="640" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Validate → Live Preview (PASS) -->
      <line x1="800" y1="240" x2="840" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Validate → Generate HTML (loop-back on FAIL — focal, dashed accent) -->
      <path d="M720,192 C860,192 860,92 800,92" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels (masked) -->
      <rect x="806" y="226" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="820" y="235" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">PASS</text>

      <rect x="820" y="132" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="858" y="141" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REGENERATE</text>

      <!-- ================= ROW 1 NODES ================= -->

      <!-- 01 Parse Canvas State -->
      <rect x="40" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="70" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="58" y="79" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">01</text>
      <text x="120" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parse Canvas State</text>
      <text x="120" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">elements · hierarchy</text>

      <!-- 02 Analyze Layout -->
      <rect x="240" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="70" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="258" y="79" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">02</text>
      <text x="320" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Analyze Layout</text>
      <text x="320" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flex vs. grid</text>

      <!-- 03 Map Tokens -->
      <rect x="440" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="448" y="70" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="458" y="79" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">03</text>
      <text x="520" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Map Tokens</text>
      <text x="520" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hardcoded → token</text>

      <!-- 04 Generate HTML -->
      <rect x="640" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="648" y="70" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="658" y="79" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">04</text>
      <text x="720" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generate HTML</text>
      <text x="720" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">semantic html5</text>

      <!-- ================= ROW 2 NODES ================= -->

      <!-- 05 Generate CSS -->
      <rect x="40" y="212" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="212" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="218" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="58" y="227" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">05</text>
      <text x="120" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generate CSS</text>
      <text x="120" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stylesheet rules</text>

      <!-- 06 Add Responsive -->
      <rect x="240" y="212" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="212" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="218" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="258" y="227" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">06</text>
      <text x="320" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Add Responsive</text>
      <text x="320" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">media queries</text>

      <!-- 07 Optimize -->
      <rect x="440" y="212" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="212" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="448" y="218" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="458" y="227" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">07</text>
      <text x="520" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Optimize</text>
      <text x="520" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">libs · minify</text>

      <!-- 08 Validate — decision diamond, FOCAL accent -->
      <polygon points="720,192 800,240 720,288 640,240" fill="#f5f5f5"/>
      <polygon points="720,192 800,240 720,288 640,240" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="720" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validate</text>
      <text x="720" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ai qa agent</text>

      <!-- Live Preview — output (oval, external treatment) -->
      <rect x="840" y="212" width="160" height="56" rx="28" fill="#f5f5f5"/>
      <rect x="840" y="212" width="160" height="56" rx="28" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="920" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Live Preview</text>
      <text x="920" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">render pane</text>

      <!-- ================= LEGEND ================= -->
      <line x1="40" y1="328" x2="1000" y2="328" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="360" width="24" height="12" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="370" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <polygon points="212,360 224,366 212,372 200,366" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="236" y="370" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision · focal</text>

      <rect x="380" y="360" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="412" y="370" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Output</text>

      <line x1="520" y1="366" x2="548" y2="366" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="556" y="370" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>

      <line x1="650" y1="366" x2="678" y2="366" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="686" y="370" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Regenerate (fail)</text>
    </svg>
  </div>
</body>
</html>
