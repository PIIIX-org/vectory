<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend / Frontend Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Design Tool System</p>
    <h1>Backend / Frontend Architecture</h1>

    <svg viewBox="0 0 1000 448" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Trust boundary containers (drawn first, as background regions) ===== -->
      <!-- BROWSER -->
      <rect x="40" y="60" width="400" height="288" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.28)" stroke-width="1.2" stroke-dasharray="6,4"/>
      <!-- SERVER -->
      <rect x="560" y="60" width="400" height="288" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.28)" stroke-width="1.2" stroke-dasharray="6,4"/>

      <!-- ===== Cross-boundary connector arrows (drawn before the connector node) ===== -->
      <line x1="440" y1="204" x2="456" y2="204" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="544" y1="204" x2="560" y2="204" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ===== Focal connector node: WebSocket / REST channel ===== -->
      <rect x="456" y="172" width="88" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="172" width="88" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="464" y="180" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="480" y="189" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
      <text x="500" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Realtime Channel</text>
      <text x="500" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WebSocket + REST</text>

      <!-- ===== BROWSER — stacked module list ===== -->
      <!-- row separators -->
      <line x1="64" y1="124" x2="416" y2="124" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="64" y1="164" x2="416" y2="164" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="64" y1="204" x2="416" y2="204" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="64" y1="244" x2="416" y2="244" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="64" y1="284" x2="416" y2="284" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <text x="64" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">UI Components</text>
      <text x="416" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">React components</text>

      <text x="64" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Canvas Engine</text>
      <text x="416" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Fabric.js / Konva</text>

      <text x="64" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">State Manager</text>
      <text x="416" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Zustand / Redux</text>

      <text x="64" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Preview Renderer</text>
      <text x="416" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">iframe · live DOM</text>

      <text x="64" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Code Editor</text>
      <text x="416" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Monaco / CodeMirror</text>

      <text x="64" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Browser Storage</text>
      <text x="416" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">IndexedDB · LocalStorage</text>

      <!-- ===== SERVER — stacked module list ===== -->
      <!-- row separators -->
      <line x1="584" y1="124" x2="936" y2="124" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="584" y1="164" x2="936" y2="164" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="584" y1="204" x2="936" y2="204" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="584" y1="244" x2="936" y2="244" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="584" y1="284" x2="936" y2="284" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <text x="584" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">API Gateway</text>
      <text x="936" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">REST · auth</text>

      <text x="584" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Agent Orchestrator</text>
      <text x="936" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Node.js · Claude SDK</text>

      <text x="584" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Agent Workers</text>
      <text x="936" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">×7 parallel</text>

      <text x="584" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Primary Database</text>
      <text x="936" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">PostgreSQL</text>

      <text x="584" y="260" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Cache Layer</text>
      <text x="936" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">Redis</text>

      <text x="584" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">File Storage</text>
      <text x="936" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">S3</text>

      <!-- ===== Boundary labels — paper mask over the dashed line ===== -->
      <rect x="64" y="52" width="88" height="16" fill="#f5f5f5"/>
      <text x="108" y="63" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">BROWSER</text>

      <rect x="584" y="52" width="72" height="16" fill="#f5f5f5"/>
      <text x="620" y="63" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.18em">SERVER</text>

      <!-- ===== Legend strip ===== -->
      <line x1="40" y1="388" x2="960" y2="388" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="420" width="14" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.28)" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="60" y="429" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Trust boundary</text>

      <rect x="200" y="420" width="14" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="220" y="429" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal · realtime channel</text>

      <line x1="420" y1="426" x2="448" y2="426" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="456" y="429" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">WebSocket / REST — primary flow</text>
    </svg>
  </div>
</body>
</html>
