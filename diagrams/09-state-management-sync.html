<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>State Management &amp; Real-time Sync · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Design Tool System</p>
    <h1>State Management &amp; Real-time Sync</h1>

    <svg viewBox="0 0 1120 760" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Arrow markers -->
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <!-- Background: clean paper, no dot pattern (minimal light variant) -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- =================================================================
             LIFELINES — dashed vertical lines from each actor.
             Centers: 112 (Designer), 336 (Client State), 560 (WS/Server),
             784 (Redis Cache), 1008 (PostgreSQL DB)
             ================================================================= -->
        <line x1="112" y1="120" x2="112" y2="664" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="336" y1="120" x2="336" y2="664" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="560" y1="120" x2="560" y2="664" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="784" y1="120" x2="784" y2="664" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1008" y1="120" x2="1008" y2="664" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- =================================================================
             ACTIVATION BARS — control-holding spans, drawn before arrows.
             ================================================================= -->
        <!-- Client State: busy from local action (176) to delta dispatch (288) -->
        <rect x="332" y="176" width="8" height="112" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- WebSocket/Server: busy from delta receipt (288) to results sent (520) -->
        <rect x="556" y="288" width="8" height="232" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- =================================================================
             MESSAGE ARROWS — time flows top→down.
             ================================================================= -->

        <!-- M1: Designer → Client State (drag / resize / edit · muted) -->
        <line x1="112" y1="176" x2="336" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M2: Client State self-message (update Zustand store · muted U-loop) -->
        <path d="M 340 208 L 376 208 L 376 240 L 340 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M3: Client State → WebSocket/Server (send delta update · link-blue, over the wire) -->
        <line x1="336" y1="288" x2="560" y2="288" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- M4: WebSocket/Server → Redis Cache (update cache · muted) -->
        <line x1="560" y1="336" x2="784" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M5: WebSocket/Server self-message (broadcast to all agents · muted U-loop) -->
        <path d="M 564 368 L 600 368 L 600 400 L 564 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M6: WebSocket/Server self-message (generate code output · FOCAL, coral U-loop) -->
        <path d="M 564 432 L 608 432 L 608 472 L 564 472" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- M7: WebSocket/Server → Client State (results back via WS · link-blue dashed return) -->
        <line x1="560" y1="520" x2="336" y2="520" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>

        <!-- M8: Client State → Designer (update preview + code editor · muted dashed return) -->
        <line x1="336" y1="568" x2="112" y2="568" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- M9: Redis Cache → PostgreSQL DB (periodic flush, every 30s · optional/async, off the main flow) -->
        <line x1="784" y1="624" x2="1008" y2="624" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- =================================================================
             MESSAGE LABELS — each with an opaque paper mask.
             ================================================================= -->

        <!-- M1 label -->
        <rect x="156" y="160" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="224" y="170" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DRAG · RESIZE · EDIT</text>

        <!-- M2 label (right of self-loop) -->
        <rect x="384" y="216" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="434" y="225" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ZUSTAND UPDATE</text>

        <!-- M3 label -->
        <rect x="392" y="272" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="448" y="282" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEND DELTA UPDATE</text>

        <!-- M4 label -->
        <rect x="628" y="320" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="330" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPDATE CACHE</text>

        <!-- M5 label (right of self-loop) -->
        <rect x="608" y="376" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="386" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BROADCAST TO AGENTS</text>

        <!-- M6 label (focal, coral) -->
        <rect x="616" y="444" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="662" y="454" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GENERATE CODE</text>

        <!-- M7 label -->
        <rect x="400" y="504" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="448" y="514" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULTS VIA WS</text>

        <!-- M8 label -->
        <rect x="160" y="552" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="224" y="562" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPDATE UI + PREVIEW</text>

        <!-- M9 label -->
        <rect x="860" y="608" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="896" y="618" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVERY 30S</text>

        <!-- =================================================================
             ACTOR BOXES — drawn after arrows/labels.
             ================================================================= -->

        <!-- Actor 1: Designer (input / user) -->
        <rect x="40" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="64" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="72" width="20" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="58" y="81" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="112" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Designer</text>
        <text x="112" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Canvas editor</text>

        <!-- Actor 2: Client State (store / Zustand) -->
        <rect x="264" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="64" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="272" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="290" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="336" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client State</text>
        <text x="336" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Zustand store</text>

        <!-- Actor 3: WebSocket / Server (backend) -->
        <rect x="480" y="64" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="488" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="504" y="81" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
        <text x="560" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WebSocket / Server</text>
        <text x="560" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Transport + agents</text>

        <!-- Actor 4: Redis Cache (store) -->
        <rect x="712" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="712" y="64" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="720" y="72" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="738" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
        <text x="784" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Redis Cache</text>
        <text x="784" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Sessions · state</text>

        <!-- Actor 5: PostgreSQL DB (external / persistent) -->
        <rect x="936" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="936" y="64" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="944" y="72" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="954" y="81" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="1008" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL DB</text>
        <text x="1008" y="111" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Projects · files</text>

        <!-- =================================================================
             ANNOTATION CALLOUT — conflict resolution, italic serif aside.
             Contained within the Client State column, no lifeline crossings.
             ================================================================= -->
        <text x="404" y="40" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">conflicts resolve last-write-wins</text>
        <path d="M 404 46 Q 398 130 358 204" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="358" cy="206" r="2" fill="#2d3142"/>

        <!-- =================================================================
             LEGEND — horizontal strip at the bottom.
             ================================================================= -->
        <line x1="40" y1="680" x2="1080" y2="680" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="696" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <!-- Item 1: Store node -->
        <rect x="40" y="712" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="60" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">State / cache store</text>

        <!-- Item 2: Activation bar -->
        <rect x="232" y="706" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="248" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Active / processing</text>

        <!-- Item 3: Network message -->
        <line x1="424" y1="716" x2="452" y2="716" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="460" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Network message</text>

        <!-- Item 4: Return / async -->
        <line x1="632" y1="716" x2="660" y2="716" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="668" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return / async</text>

        <!-- Item 5: Code generation (focal) -->
        <line x1="848" y1="716" x2="876" y2="716" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="884" y="720" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Code generation</text>

      </svg>
  </div>
</body>
</html>
