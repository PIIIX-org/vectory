<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Tool System · Data Flow &amp; Transformation</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Design Tool System</p>
    <h1>Data Flow &amp; Transformation</h1>

    <svg viewBox="0 0 1300 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Primary flow chain — arrows drawn before boxes -->
      <line x1="220" y1="128" x2="248" y2="128" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="428" y1="128" x2="456" y2="128" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="636" y1="128" x2="664" y2="128" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="844" y1="128" x2="872" y2="128" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="1052" y1="128" x2="1080" y2="128" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Column 1: Designer Input (input treatment) -->
      <rect x="40" y="40" width="180" height="176" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="40" width="180" height="176" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="56" y="52" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="72" y="61" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="204" y="200" fill="rgba(122,131,153,0.14)" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="130" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Designer Input</text>
      <text x="56" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Canvas actions</text>
      <text x="56" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Responsive setup</text>
      <text x="56" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Tokens &amp; annotations</text>

      <!-- Column 2: Normalization (store treatment) -->
      <rect x="248" y="40" width="180" height="176" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="40" width="180" height="176" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="264" y="52" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="280" y="61" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NORM</text>
      <text x="412" y="200" fill="rgba(79,93,117,0.12)" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
      <text x="338" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Normalization</text>
      <text x="264" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Canvas state tree</text>
      <text x="264" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Design system</text>
      <text x="264" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Responsive config</text>

      <!-- Column 3: AI Processing (focal — transformative core) -->
      <rect x="456" y="40" width="180" height="176" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="40" width="180" height="176" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="472" y="52" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="488" y="61" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
      <text x="620" y="200" fill="rgba(235,108,54,0.14)" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">03</text>
      <text x="546" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI Processing</text>
      <text x="472" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Code generation</text>
      <text x="472" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Library selection</text>
      <text x="472" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Validation</text>

      <!-- Column 4: Generated Artifacts (backend/step treatment) -->
      <rect x="664" y="40" width="180" height="176" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="40" width="180" height="176" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="680" y="52" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="696" y="61" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GEN</text>
      <text x="828" y="200" fill="rgba(45,49,66,0.07)" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">04</text>
      <text x="754" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generated Artifacts</text>
      <text x="680" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– HTML structure</text>
      <text x="680" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– CSS + media queries</text>
      <text x="680" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Metadata</text>

      <!-- Column 5: Output (external treatment) -->
      <rect x="872" y="40" width="180" height="176" rx="6" fill="#f5f5f5"/>
      <rect x="872" y="40" width="180" height="176" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="888" y="52" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="904" y="61" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="1036" y="200" fill="rgba(45,49,66,0.07)" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">05</text>
      <text x="962" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Output</text>
      <text x="888" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Browser preview</text>
      <text x="888" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Code editor view</text>
      <text x="888" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Export / deploy</text>

      <!-- Column 6: Persistence (store treatment) -->
      <rect x="1080" y="40" width="180" height="176" rx="6" fill="#f5f5f5"/>
      <rect x="1080" y="40" width="180" height="176" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="1096" y="52" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="1112" y="61" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="1244" y="200" fill="rgba(79,93,117,0.12)" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">06</text>
      <text x="1170" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Persistence</text>
      <text x="1096" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Database</text>
      <text x="1096" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– Cache</text>
      <text x="1096" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">– File storage</text>

      <!-- Legend strip -->
      <line x1="40" y1="256" x2="1260" y2="256" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="288" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="60" y="296" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text>

      <rect x="240" y="288" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="260" y="296" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">State / store</text>

      <rect x="440" y="288" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="460" y="296" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">AI core (focal)</text>

      <rect x="640" y="288" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="296" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Generated / step</text>

      <rect x="840" y="288" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="860" y="296" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External / output</text>

      <line x1="1040" y1="293" x2="1068" y2="293" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="1076" y="296" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>
    </svg>
  </div>
</body>
</html>
