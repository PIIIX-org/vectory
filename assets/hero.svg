.cur{animation:blink 1.2s steps(2) infinite} @keyframes blink{to{opacity:0}}
.line{opacity:0;animation:type 8s linear infinite} @keyframes type{0%{opacity:0}12%{opacity:1}100%{opacity:1}}
.sel{stroke-dasharray:6 4;animation:march 1.5s linear infinite} @keyframes march{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion: reduce){.cur,.line,.sel{animation:none !important} .line{opacity:1}}
</style>
