<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" role="img" aria-labelledby="t d">
<title id="t">Vectory: a design canvas that writes the HTML as you draw</title>
<desc id="d">A blueprint of the Vectory interface: rulers along the top and left, a selected hero frame with a headline, a paragraph and a button on the canvas, and a code panel on the right showing the HTML those shapes would emit. A seal in the corner reads ON HOLD.</desc>
